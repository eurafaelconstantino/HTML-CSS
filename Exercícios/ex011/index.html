<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p
    >Tente abrir esse site emvários dispositivos diferentes simultaneamente ou aumente e diminua otamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/paisagem300.jpg" type="image/jpg">
        <source media="(max-width: 1050px)" srcset="imagens/paisagem700.jpg" type="image/jpg">
        <img src="imagens/paisagem-full.jpg" alt="imagem flexivel">
    </picture>
